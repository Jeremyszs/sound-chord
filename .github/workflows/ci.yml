name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          uv pip install -e ".[api,eval,dev]"
      - name: Lint
        run: uv run ruff check src tests scripts eval
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}
      - name: Fetch models
        run: uv run python scripts/fetch_models.py
      - name: Test
        run: uv run pytest -q
