[project]
name = "chordanalyzer"
version = "0.1.0"
description = "Detect tempo, key and beat-aligned chord progressions in audio files, as a Python package, CLI and HTTP API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "torch>=2.6",
    "beat-this>=1.1",
    "librosa>=1.0",
    "numpy>=2.1",
    "scipy",
    "soundfile",
    "soxr",
    "einops",
    "rotary-embedding-torch",
    "safetensors",
    "pydantic>=2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]", "python-multipart"]
eval = ["mir_eval>=0.8", "pandas"]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
chordanalyzer = "chordanalyzer.cli:main"
chordanalyzer-api = "chordanalyzer.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chordanalyzer"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the BTC weights in models/ (run scripts/fetch_models.py)"]
